name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Rust tests and macOS application
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      PCRE2_SYS_STATIC: "1"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      CARGO_TERM_COLOR: always
      APFSEARCH_COMPILE_ONLY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Validate native UI build toolchain
        run: python3 scripts/build_toolchain.py
      - name: Archive the exact source under validation
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/validated-source.tar.gz" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-source
          path: ${{ runner.temp }}/validated-source.tar.gz
          retention-days: 3
      - name: Prepare Rust toolchain
        run: rustup update stable --no-self-update && rustup default stable && rustup component add rustfmt clippy && rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Check formatting
        run: cargo fmt --manifest-path core/Cargo.toml --check
      - name: Rust tests
        if: ${{ !cancelled() }}
        run: cargo test --locked --no-fail-fast --manifest-path core/Cargo.toml -- --test-threads=1
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --manifest-path core/Cargo.toml --all-targets -- -D warnings
      - name: Repository consistency checks
        if: ${{ !cancelled() }}
        run: |
          python3 tests/check_localization.py
          python3 tests/check_localization_protocol.py
          python3 tests/check_application_identity.py
          python3 tests/run_service_recovery_tests.py
      - name: Build app, XPC service, and CLI without signing or installation
        if: ${{ !cancelled() }}
        run: ./build.sh
      - name: Release configuration and independent audit fixtures
        if: ${{ !cancelled() }}
        run: |
          python3 tests/test_release_and_audit.py
          python3 tests/test_release_downloads.py
          python3 tests/test_build_toolchain.py
          python3 tests/test_memory_comparison.py
          bash -n scripts/release.sh
          bash -n scripts/release_downloads.sh
      - name: Swift service and content regression fixtures
        if: ${{ !cancelled() }}
        run: APFSEARCH_SWIFT_ONLY=1 ./tests/run.sh
      - name: Selection, file safety, properties, and update transport fixtures
        if: ${{ !cancelled() }}
        run: python3 tests/run_feature_tests.py
      - name: AppKit controller regression fixtures
        if: ${{ !cancelled() }}
        run: python3 tests/run_search_window_tests.py --report validation/search-window.json
      - name: Preserve isolated validation reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-reports
          path: validation/*.json
          if-no-files-found: error
          retention-days: 7
