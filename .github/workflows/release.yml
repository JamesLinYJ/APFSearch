name: Signed macOS release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to release
        required: true
        default: main
      tag:
        description: Release tag (for example v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: true
          fetch-depth: 0
      - name: Import Developer ID certificates
        env:
          CERTIFICATES_P12: ${{ secrets.FILESEARCH_CERTIFICATES_P12 }}
          CERTIFICATES_PASSWORD: ${{ secrets.FILESEARCH_CERTIFICATES_PASSWORD }}
        run: |
          test -n "$CERTIFICATES_P12"
          KEYCHAIN="$RUNNER_TEMP/filesearch-signing.keychain-db"
          security create-keychain -p "$RUNNER_TEMP" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$RUNNER_TEMP" "$KEYCHAIN"
          printf '%s' "$CERTIFICATES_P12" | base64 --decode > "$RUNNER_TEMP/certificates.p12"
          security import "$RUNNER_TEMP/certificates.p12" -k "$KEYCHAIN" -P "$CERTIFICATES_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$RUNNER_TEMP" "$KEYCHAIN"
      - name: Build, sign, notarize, verify, and sign update manifest
        env:
          PCRE2_SYS_STATIC: "1"
          FILESEARCH_SIGN_IDENTITY: ${{ secrets.FILESEARCH_SIGN_IDENTITY }}
          FILESEARCH_INSTALLER_IDENTITY: ${{ secrets.FILESEARCH_INSTALLER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          FILESEARCH_UPDATE_PUBLIC_KEY: ${{ secrets.FILESEARCH_UPDATE_PUBLIC_KEY }}
          FILESEARCH_UPDATE_PRIVATE_KEY: ${{ secrets.FILESEARCH_UPDATE_PRIVATE_KEY }}
          FILESEARCH_RELEASE_DIR: ${{ runner.temp }}/release
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test -n "$FILESEARCH_UPDATE_PUBLIC_KEY"
          export FILESEARCH_RELEASE_VERSION="${RELEASE_TAG#v}"
          APP_NAME="$(python3 scripts/build_identity.py applicationExecutable)"
          export FILESEARCH_UPDATE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APP_NAME}.pkg"
          ./scripts/release.sh
      - name: Publish or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_DIR: ${{ runner.temp }}/release
        run: |
          PKG="$(find "$RELEASE_DIR" -maxdepth 1 -name '*.pkg' -print -quit)"
          test -n "$PKG" && test -f "$RELEASE_DIR/update.json"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$PKG" "$PKG.sha256" "$RELEASE_DIR/update.json" --clobber
          else
            gh release create "$RELEASE_TAG" "$PKG" "$PKG.sha256" "$RELEASE_DIR/update.json" --target "${{ inputs.ref }}" --generate-notes --latest
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: notarized-installer
          path: |
            ${{ runner.temp }}/release/*.pkg
            ${{ runner.temp }}/release/*.sha256
            ${{ runner.temp }}/release/update.json
          if-no-files-found: error
          retention-days: 14
