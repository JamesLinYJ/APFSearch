name: Signed macOS release
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full 40-character main commit SHA to release
        required: true
      tag:
        description: New release tag matching the source version (for example v0.1.5)
        required: true
permissions:
  contents: read
concurrency:
  group: signed-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    environment: release
    permissions:
      contents: write
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RELEASE_COMMIT: ${{ inputs.ref }}
      RELEASE_TAG: ${{ inputs.tag }}
      PCRE2_SYS_STATIC: "1"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - name: Validate release identifiers
        run: |
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]{1,6}(\.[0-9]{1,6}){2}$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Require current main and a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-parse refs/remotes/origin/main)" = "$RELEASE_COMMIT"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo 'An existing release tag cannot be reused.' >&2
            exit 1
          fi
          python3 scripts/validate_release.py "$RELEASE_TAG"
          # The authenticated API must succeed before deciding that no release exists.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags.txt"
          if grep -Fxq "$RELEASE_TAG" "$RUNNER_TEMP/release-tags.txt"; then
            echo 'An existing release cannot be overwritten.' >&2
            exit 1
          fi
      - name: Prepare build tools
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          python3 -m venv "$RUNNER_TEMP/packaging-tools"
          "$RUNNER_TEMP/packaging-tools/bin/pip" install -r scripts/requirements-distribution.txt
      - name: Validate before accessing signing credentials
        run: |
          cargo fmt --manifest-path core/Cargo.toml --check
          cargo clippy --locked --manifest-path core/Cargo.toml --all-targets -- -D warnings
          python3 tests/check_application_identity.py
          python3 tests/test_release_and_audit.py
          python3 tests/test_release_downloads.py
          bash tests/run.sh
      - name: Import temporary signing and notarization credentials
        env:
          CERTIFICATE_P12: ${{ secrets.APFSEARCH_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APFSEARCH_CERTIFICATE_PASSWORD }}
          NOTARY_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$CERTIFICATE_P12" && test -n "$CERTIFICATE_PASSWORD"
          test -n "$NOTARY_PRIVATE_KEY" && test -n "$NOTARY_KEY_ID" && test -n "$NOTARY_ISSUER_ID"
          KEYCHAIN="$RUNNER_TEMP/apfsearch-signing.keychain-db"
          PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$PASSWORD"
          trap 'rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/notary-key.p8"' EXIT
          security list-keychains -d user > "$RUNNER_TEMP/original-keychains.txt"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASSWORD" "$KEYCHAIN" >/dev/null
          printf '%s' "$NOTARY_PRIVATE_KEY" > "$RUNNER_TEMP/notary-key.p8"
          xcrun notarytool store-credentials APFSearch-CI --key "$RUNNER_TEMP/notary-key.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --keychain "$KEYCHAIN" >/dev/null
      - name: Build and notarize all download variants
        env:
          APFSEARCH_SIGN_IDENTITY: ${{ secrets.APFSEARCH_SIGN_IDENTITY }}
          APFSEARCH_NOTARY_PROFILE: APFSearch-CI
          APFSEARCH_NOTARY_KEYCHAIN: ${{ runner.temp }}/apfsearch-signing.keychain-db
          APFSEARCH_BUILD_DIR: ${{ runner.temp }}/apfsearch-build
          APFSEARCH_RELEASE_DIR: ${{ runner.temp }}/release
          APFSEARCH_PACKAGING_PYTHON: ${{ runner.temp }}/packaging-tools/bin/python
        run: bash scripts/release_downloads.sh "$RELEASE_TAG"
      - name: Publish verified downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/validate_release.py "$RELEASE_TAG" --downloads "$RUNNER_TEMP/release/downloads"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_COMMIT" >/dev/null
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/release/downloads/"* \
            --verify-tag --draft --prerelease --title "APFSearch ${RELEASE_TAG#v} Preview" \
            --notes-file "docs/releases/${RELEASE_TAG#v}.md"
          mkdir "$RUNNER_TEMP/download-readback"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/download-readback"
          python3 scripts/validate_release.py "$RELEASE_TAG" --downloads "$RUNNER_TEMP/download-readback"
          diff -r "$RUNNER_TEMP/release/downloads" "$RUNNER_TEMP/download-readback"
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
      - name: Remove temporary signing credentials
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import os, pathlib, shlex, subprocess
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          try:
              saved = temp/'original-keychains.txt'
              if saved.exists():
                  subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', *shlex.split(saved.read_text())], check=True)
          finally:
              try:
                  keychain = temp/'apfsearch-signing.keychain-db'
                  if keychain.exists():
                      subprocess.run(['security', 'delete-keychain', str(keychain)], check=True)
              finally:
                  for filename in ('certificate.p12', 'notary-key.p8', 'original-keychains.txt'):
                      (temp/filename).unlink(missing_ok=True)
          PY
