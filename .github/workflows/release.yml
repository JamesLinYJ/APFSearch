name: Signed macOS release
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full 40-character commit SHA to release
        required: true
      tag:
        description: Immutable release tag, such as v1.0.0
        required: true
permissions:
  contents: write
concurrency:
  group: signed-release
  cancel-in-progress: false
jobs:
  release:
    environment: release
    runs-on: macos-15
    timeout-minutes: 45
    env:
      RELEASE_COMMIT: ${{ inputs.ref }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate immutable release identifiers
        run: |
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]{1,6}(\.[0-9]{1,6}){1,3}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install universal macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Validate selected source before importing credentials
        env:
          PCRE2_SYS_STATIC: "1"
          MACOSX_DEPLOYMENT_TARGET: "14.0"
          APFSEARCH_COMPILE_ONLY: "1"
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo 'An existing release tag cannot be reused.' >&2
            exit 1
          fi
          cargo fmt --manifest-path core/Cargo.toml --check
          cargo test --locked --manifest-path core/Cargo.toml -- --test-threads=1
          ./build.sh
          python3 tests/run_feature_tests.py
      - name: Refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'An existing release cannot be overwritten.' >&2
            exit 1
          fi
      - name: Import temporary Developer ID keychain
        env:
          CERTIFICATES_P12: ${{ secrets.APFSEARCH_CERTIFICATES_P12 }}
          CERTIFICATES_PASSWORD: ${{ secrets.APFSEARCH_CERTIFICATES_PASSWORD }}
        run: |
          test -n "$CERTIFICATES_P12" && test -n "$CERTIFICATES_PASSWORD"
          KEYCHAIN="$RUNNER_TEMP/apfsearch-signing.keychain-db"
          PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$PASSWORD"
          security list-keychains -d user > "$RUNNER_TEMP/original-keychains.txt"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          printf '%s' "$CERTIFICATES_P12" | base64 --decode > "$RUNNER_TEMP/certificates.p12"
          security import "$RUNNER_TEMP/certificates.p12" -k "$KEYCHAIN" -P "$CERTIFICATES_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASSWORD" "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/certificates.p12"
      - name: Build, notarize and sign update metadata
        env:
          PCRE2_SYS_STATIC: "1"
          APFSEARCH_SIGN_IDENTITY: ${{ secrets.APFSEARCH_SIGN_IDENTITY }}
          APFSEARCH_INSTALLER_IDENTITY: ${{ secrets.APFSEARCH_INSTALLER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APFSEARCH_UPDATE_PUBLIC_KEY: ${{ secrets.APFSEARCH_UPDATE_PUBLIC_KEY }}
          APFSEARCH_UPDATE_PRIVATE_KEY: ${{ secrets.APFSEARCH_UPDATE_PRIVATE_KEY }}
          APFSEARCH_RELEASE_DIR: ${{ runner.temp }}/release
        run: |
          export APFSEARCH_RELEASE_VERSION="${RELEASE_TAG#v}"
          APP_NAME="$(python3 scripts/build_identity.py applicationExecutable)"
          export APFSEARCH_UPDATE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APP_NAME}.pkg"
          export APFSEARCH_UPDATE_FEED_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/update.json"
          bash scripts/release.sh
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP_NAME="$(python3 scripts/build_identity.py applicationExecutable)"
          PKG="$RUNNER_TEMP/release/$APP_NAME.pkg"
          test -f "$PKG" && test -f "$RUNNER_TEMP/release/update.json"
          # Atomic create-only tag operation rejects a concurrent publisher.
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_COMMIT"
          gh release create "$RELEASE_TAG" "$PKG" "$PKG.sha256" "$RUNNER_TEMP/release/update.json" \
            --verify-tag --generate-notes --draft
          # Never make an incomplete asset set the automatic update feed.
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Remove temporary signing credentials
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import os, pathlib, shlex, subprocess
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          saved = temp/'original-keychains.txt'
          if saved.exists():
              subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', *shlex.split(saved.read_text())], check=True)
          keychain = temp/'apfsearch-signing.keychain-db'
          if keychain.exists():
              subprocess.run(['security', 'delete-keychain', str(keychain)], check=True)
          (temp/'certificates.p12').unlink(missing_ok=True)
          PY
