name: Integrate and validate feature sources
on:
  push:
    branches: [perf/bounded-incremental-index]
    paths:
      - .github/workflows/_integrate_features.yml
      - scripts/feature-integration/**
permissions:
  contents: write
concurrency:
  group: feature-integration
  cancel-in-progress: true
jobs:
  integrate:
    if: github.ref == 'refs/heads/perf/bounded-incremental-index'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      PCRE2_SYS_STATIC: "1"
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      FILESEARCH_COMPILE_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install formatting and lint tools
        run: rustup update stable --no-self-update && rustup default stable && rustup component add rustfmt clippy
      - name: Apply reviewed source patches
        run: |
          test "$(git hash-object core/src/lib.rs)" = fc17aa63d4bc8d3496fcb39f7b4e66a6c877f87e
          test "$(git hash-object macos/Application.swift)" = beb9535eef36128ed1eab6c16bcac381e96eea96
          test "$(git hash-object macos/ContentIndexer.swift)" = aad182acf9352ff7e477e9a5dde284302bd53c72
          for patch in \
            scripts/feature-integration/engine.patch \
            scripts/feature-integration/query.patch \
            scripts/feature-integration/index.patch
          do
            echo "::group::Applying $patch"
            git apply --check "$patch"
            git apply "$patch"
            echo "::endgroup::"
          done
          python3 scripts/feature-integration/apply_status_ui.py
          for patch in \
            scripts/feature-integration/selection.patch \
            scripts/feature-integration/selection-actions.patch \
            scripts/feature-integration/content.patch
          do
            echo "::group::Applying $patch"
            git apply --check "$patch"
            git apply "$patch"
            echo "::endgroup::"
          done
          cargo fmt --manifest-path core/Cargo.toml
          git diff --check
      - name: All Rust regressions
        run: cargo test --locked --no-fail-fast --manifest-path core/Cargo.toml -- --test-threads=1
      - name: Clippy
        run: cargo clippy --locked --manifest-path core/Cargo.toml --all-targets -- -D warnings
      - name: Complete macOS build
        run: ./build.sh
      - name: Preserve formatted source for diagnosis
        run: tar -czf "$RUNNER_TEMP/feature-source.tar.gz" core/src core/tests macos/Application.swift macos/ContentIndexer.swift
      - uses: actions/upload-artifact@v4
        with:
          name: feature-source
          path: ${{ runner.temp }}/feature-source.tar.gz
          retention-days: 3
      - name: Commit validated sources without dropping concurrent PR commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/src core/tests macos/Application.swift macos/ContentIndexer.swift
          git diff --cached --check
          git commit -m 'feat: integrate relations, cross-page operations, properties and status'
          git fetch origin perf/bounded-incremental-index
          git rebase origin/perf/bounded-incremental-index
          git push origin HEAD:refs/heads/perf/bounded-incremental-index
