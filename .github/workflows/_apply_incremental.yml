name: Apply guarded incremental implementation
on:
  push:
    branches: [perf/bounded-incremental-index]
    paths:
      - .github/workflows/_apply_incremental.yml
      - scripts/_apply_incremental_patch.py
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/perf/bounded-incremental-index'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      PCRE2_SYS_STATIC: "1"
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      FILESEARCH_COMPILE_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update && rustup default stable && rustup component add rustfmt clippy
      - name: Apply guarded source changes
        run: |
          python3 scripts/_apply_incremental_patch.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('core/src/query_cache_tests.rs')
          text = path.read_text()
          old = 'if sql.starts_with(b"SELECT f.id,") {'
          new = 'if sql.starts_with(b"SELECT f.id,") || sql.starts_with(b"SELECT j.id,") {'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new))
          path = Path('core/src/bounded_cache_tests.rs')
          text = path.read_text()
          for index in [3002, 3003]:
              old = f'&[files[{index:_}].path.clone()]'
              new = f'std::slice::from_ref(&files[{index:_}].path)'
              assert text.count(old) == 1
              text = text.replace(old, new)
          path.write_text(text)
          path = Path('core/tests/cache_recovery.rs')
          text = path.read_text()
          old = '.query_row("PRAGMA user_version", [], |r| r.get::<_, i64>(0))\n            .unwrap(),\n        3'
          assert text.count(old) == 2
          text = text.replace(old, old[:-1] + '4')
          old = '    store.batch(&changed, 2).unwrap();\n'
          assert text.count(old) == 1
          extra = '\n'.join([
              '    assert_eq!(store.get("cache_journal_overflow", json!(false)), json!(false));',
              '    assert_current(&store);',
              '    // Fill only disposable tombstone IDs, not a large filesystem or metadata fixture.',
              '    // Keep positive IDs free so actual file triggers exercise the overflow transition.',
              '    let pending: i64 = store.connection.query_row("SELECT count(*) FROM cache_changes", [], |r| r.get(0)).unwrap();',
              '    let transaction = store.connection.transaction().unwrap();',
              '    {',
              '        let mut insert = transaction.prepare("INSERT INTO cache_changes VALUES(?1)").unwrap();',
              '        for id in 1..=65_536 - pending { insert.execute([-id]).unwrap(); }',
              '    }',
              '    transaction.commit().unwrap();',
              '    assert_eq!(store.get("cache_journal_overflow", json!(false)), json!(false));',
              '    assert_eq!(store.connection.query_row("SELECT pending_count FROM cache_journal_state", [], |r| r.get::<_, i64>(0)).unwrap(), 65_536);',
              '    store.batch(&[row("overflow.txt", 99_999), row("after-overflow.txt", 100_000)], 2).unwrap();',
              '    assert_eq!(store.connection.query_row("SELECT pending_count FROM cache_journal_state", [], |r| r.get::<_, i64>(0)).unwrap(), 0);',
              '',
          ])
          text = text.replace(old, old + extra)
          path.write_text(text)
          PY
      - name: Format and validate the actual implementation
        run: |
          cargo fmt --manifest-path core/Cargo.toml
          git diff --check
          cargo test --locked --no-fail-fast --manifest-path core/Cargo.toml -- --test-threads=1
          cargo clippy --locked --manifest-path core/Cargo.toml --all-targets -- -D warnings
          ./build.sh
      - name: Publish only validated source changes to the PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/src/index_store.rs core/src/cache_journal.rs core/src/change_reader.rs core/src/ordered_merge.rs core/src/bounded_cache_tests.rs core/src/query_cache_tests.rs core/tests/cache_recovery.rs README.md core/README.md
          git diff --cached --stat
          git commit -m 'perf: replay bounded cache deltas and batch sorted slot updates'
          git push origin HEAD:refs/heads/perf/bounded-incremental-index
