[package]
name = "apfsearch-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "APFS metadata index and Everything-style query engine"

[lib]
name = "apfsearch_core"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
pcre2 = "0.2"
roaring = "0.11"
arc-swap = "1"
unicode-normalization = "0.1"
icu_casemap = "2"
chrono = "0.4"
blake3 = "1"
memmap2 = "0.9"
memchr = "2"

[dev-dependencies]
chrono-tz = "0.10"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
